name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: SecurityRonin/fleet-config/.github/workflows/rust-ci.yml@29389c094b9d2e95493d5f8857dd51d5407559a0
    with:
      # MIGRATION DEBT, carried across as-is rather than quietly changed by this
      # PR. This repo enforces an aggregate 85% line floor, not the fleet's
      # per-line gate. A floor cannot honour a `// cov:unreachable` exemption and
      # never names which lines are uncovered, so the shared workflow renders it
      # in the checks UI as debt rather than as a passing gate.
      #
      # The uncovered surface is already known and documented in the workflow
      # this replaces: cli/src/mcp.rs and the main()/handler render shells are
      # exercised end-to-end rather than by unit tests. Clear it by testing those
      # paths (or annotating the provably-dead arms), then delete these two lines.
      coverage-gate: floor
      coverage-floor: 85

  # Reporting only — RustCrypto internals (md-5/digest) use unsafe for
  # performance. Review the output; a spike vs baseline warrants investigation.
  # Repo-specific, so it stays here rather than moving into the shared workflow.
  geiger:
    name: Unsafe Audit (cargo-geiger)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      - run: cargo install cargo-geiger --locked
      - run: cargo geiger 2>&1 || true
